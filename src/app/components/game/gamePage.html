
<app-navBar></app-navBar>

<div class="game-container">

    <!-- TOP SECTION -->
    <div class="top-section">

        <div class="left">
            <img [src]="currentCoverImage" alt="cover" class="cover">

            <div class="gallery-container">
                <button class="gallery-control prev" type="button" (click)="scrollGallery(-1)" aria-label="Scroll gallery left">‹</button>
                <div class="gallery" #galleryScroll>
                    <img
                        *ngFor="let img of game.gallery; let i = index"
                        [src]="img"
                        [alt]="game.title + ' screenshot ' + (i + 1)"
                        [class.active]="i === selectedGalleryIndex"
                        (click)="selectGalleryImage(i)"
                    />
                </div>
                <button class="gallery-control next" type="button" (click)="scrollGallery(1)" aria-label="Scroll gallery right">›</button>
            </div>
        </div>

        <div class="right">
            <h1>{{ game.title }}</h1>

            <p class="description">{{ game.description }}</p>

            <div class="game-meta">
                <div class="meta-item">
                    <strong>Studio</strong>
                    <span>{{ game.studio }}</span>
                </div>
                <div class="meta-item">
                    <strong>Genre</strong>
                    <span>{{ game.genre }}</span>
                </div>
            </div>

            <!-- Rating -->
            <div class="rating">
                <span *ngFor="let star of [1,2,3,4,5]">
                    <i class="star" [class.filled]="star <= game.rating">★</i>
                </span>
            </div>

            <div class="rating-form">
                <h3>Change Rating</h3>
                <form (ngSubmit)="updateRating()" #ratingForm="ngForm">
                    <input 
                        type="number" 
                        min="1" 
                        max="5" 
                        [(ngModel)]="newRating" 
                        name="newRating"
                        placeholder="Enter rating (1-5)"
                        required
                    />
                    <button type="submit" [disabled]="!ratingForm.valid">Update Rating</button>
                </form>
            </div>
        </div>

    </div>

    <!-- CATEGORY VOTING -->
    <h2 class = "vote-title">Vote this game</h2>
    <div class="categories">
        
        
        <button *ngFor="let cat of game.categories" (click)="vote(cat)">
            {{ cat }}
        </button>
    </div>

    @if((isLogged$ | async)) { 
                <!-- ADD COMMENT FORM -->
        <div class="add-comment-section">
            <h2>Add a Comment</h2>
            <form (ngSubmit)="addComment()" #commentForm="ngForm">
                <div class="form-group">
                    <label for="userName">Your Name</label>
                    <input 
                        type="text" 
                        id="userName"
                        [(ngModel)]="newComment.user" 
                        name="userName"
                        placeholder="Enter your name"
                        required
                    />
                </div>
                <div class="form-group">
                    <label for="commentMessage">Comment</label>
                    <textarea 
                        id="commentMessage"
                        [(ngModel)]="newComment.message" 
                        name="commentMessage"
                        placeholder="Write your comment..."
                        rows="4"
                        required
                    ></textarea>
                </div>
                <button type="submit" [disabled]="!commentForm.valid">Post Comment</button>
            </form>
        </div>
    }

    <!-- COMMENTS -->
    <div class="comments">
        <h2>Comments</h2>

        @for (comment of game.comments; track comment.user) {
            <div class="comment">
                <strong>{{ comment.user }}</strong>
                <p>{{ comment.message }}</p>
            </div>
        }   

    </div>

</div>

<app-footer></app-footer>
